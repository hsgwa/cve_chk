# vuln-triage の設定。書いていない項目は既定値が使われる。

# ---- 社内ランクと対応期限 ----------------------------------------------------
# 会社公表リストにランク・日数が書かれていればそちらが優先される。
# 書かれていない場合に、CVSS v3 と公開区分（internet / internal）から決める。
rank_matrix:
  - {min_cvss: 9.0, internet: {rank: Rank-S, days: 3},  internal: {rank: Rank-A, days: 14}}
  - {min_cvss: 7.0, internet: {rank: Rank-A, days: 14}, internal: {rank: Rank-B, days: 30}}
  - {min_cvss: 4.0, internet: {rank: Rank-B, days: 30}, internal: {rank: Rank-C, days: 90}}
default_rank: {rank: Rank-C, days: 90}      # CVSS 4.0 未満、または CVSS 不明
rank_order: [Rank-S, Rank-A, Rank-B, Rank-C]  # 厳しい順

# CVSS が複数のソースにある場合に優先するソース。無ければ全ソースの最大値。
cvss_source_priority: [nvd]

# ---- 製品名の別名 ------------------------------------------------------------
# 通達の製品名と、回収データ上の名前が違う場合に対応付ける（大文字小文字は無視）。
# 通達側で「HULFT*」のようにワイルドカード、「re:^HULFT\d」のように正規表現も使える。
aliases:
  HULFT: ["HULFT8", "HULFT8 for Windows", "HULFT8 for Linux", "HULFT10"]
  DataMagic: ["DataMagic Server", "DataMagic for Windows"]
  log4j-core: ["org.apache.logging.log4j:log4j-core"]

# 回収からこの日数を超えたインベントリは「収集状況」シートで警告する。
stale_days: 90

# ---- Trivy -------------------------------------------------------------------
trivy:
  path: ""            # 空なら PATH から探す。例: C:\tools\trivy\trivy.exe
  timeout_sec: 600
  extra_args: []      # 例: ["--skip-db-update"]

# ---- Windows OS の脆弱性（Microsoft の公開データで判定） ----------------------
msrc:
  enabled: true
  timeout_sec: 60
  # サポートが終了した OS のビルド番号。該当する環境は「判定不能（要確認）」になる。
  eol_builds: [9600, 14393]

# ---- 会社公表リスト（Excel / CSV）の読み方 ------------------------------------
advisory_input:
  sheet: ""           # 空なら先頭のシート
  header_row: 1       # 見出しのある行
  fill_merged: false  # true にすると結合セルの値を各行に引き継ぐ
  columns:            # ツール内の項目名: 会社の見出し（候補を複数書ける）
    advisory_id:      ["通達番号", "通達ID", "管理番号", "advisory_id"]
    cve_id:           ["CVE番号", "CVE", "cve_id"]
    product_name:     ["製品名", "対象製品", "product_name"]
    affected_version: ["影響バージョン", "対象バージョン", "affected_version"]
    published_date:   ["公表日", "通達日", "published_date"]
    company_rank:     ["社内ランク", "company_rank"]
    deadline_days:    ["対応期限(日)", "deadline_days"]
    note:             ["備考", "note"]
