# 脆弱確認（zk）の設定。書いていない項目は既定値が使われる。ふだんは変えなくてよい。

# 回収からこの日数を超えた回収物は「収集状況」シートで警告する。
stale_days: 90

# Excel の 1 シートに書く行数の上限（Excel の上限は約 104 万行。多いと開くのも遅い）。
# 超えた分は Excel には書かず、CSV にだけ全件を出す。
xlsx_max_rows: 100000

# ---- 照合に使うもの -----------------------------------------------------------
# osv   = 手元の脆弱性データ（OSV.dev と Amazon Linux の公式情報。exe 不要。既定）
# trivy = Trivy（trivy.exe が必要）
scanner: osv

# ---- 手元の脆弱性データ（zk update で取得） ------------------------
vulndb:
  dir: vulndb             # 置き場所
  max_age_days: 1         # 最後の更新からこの日数を超えたデータで実行すると警告する（照合の前に update する前提）
  full_refresh_days: 7    # 普段は差分だけ取得し、この日数ごとに全件を取り直す
  max_delta_records: 3000 # 差分がこの件数を超えたら全件を取り直す
  # Amazon Linux 2 の extras（kernel-5.10 など）のうち取得するトピック。all（既定・推奨）、一覧、[]（取らない）
  amazon_extras: all
  # Amazon Linux の公式リポジトリ（ミラー一覧）。近いリージョンに変えてもよい
  amazon_mirrors:
    "2": http://amazonlinux.default.amazonaws.com/2/core/latest/x86_64/mirror.list
    "2023": https://al2023-repos-us-east-1-de612dc2.s3.dualstack.us-east-1.amazonaws.com/core/mirrors/latest/x86_64/mirror.list

# ---- Trivy（scanner: trivy の場合のみ） --------------------------------------
trivy:
  path: ""            # 空なら PATH から探す。例: C:\tools\trivy\trivy.exe
  timeout_sec: 600
  extra_args: []      # 例: ["--skip-db-update"]

# ---- Windows OS の脆弱性（Microsoft の公開データで判定。CVE の一覧を渡したときだけ） --------
msrc:
  enabled: true
  timeout_sec: 60
  # サポートが終了した OS のビルド番号。該当するサーバーは「判定不能（要確認）」になる。
  eol_builds: [9600, 14393]
