[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zeijaku-kakunin"
version = "0.9.0"
description = "脆弱確認（zk）: オフライン環境のソフトの一覧と会社公表の脆弱性リストを突き合わせる CLI"
requires-python = ">=3.10"
license = "MIT-0"
license-files = ["LICENSE"]
dependencies = [
    "pyyaml>=6",
    "packaging>=23",
    "click>=8",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
zk = "zeijaku_kakunin.cli:main"
zeijaku-kakunin = "zeijaku_kakunin.cli:main"
# 旧名（0.7.0 まで）。しばらく残す
vuln-triage = "zeijaku_kakunin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
